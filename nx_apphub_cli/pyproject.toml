[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-apphub-cli"
version = "1.0.0"
description = "NX AppHub CLI is a lightweight command-line tool for managing and building applications in Nitrux as AppImages."
authors = [
    { name = "Uri Herrera", email = "uri_herrera@nxos.org" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "requests",
    "pyyaml",
    "tqdm"
]

[project.urls]
Homepage = "https://github.com/Nitrux/nx-apphub"

[project.scripts]
nx-apphub-cli = "nx_apphub_cli.cli:main"
